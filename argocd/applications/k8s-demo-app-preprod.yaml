{
  "apiVersion": "argoproj.io/v1alpha1",
  "kind": "Application",
  "metadata": {
    "name": "k8s-demo-app-preprod",
    "namespace": "argocd"
  },
  "spec": {
    "destination": {
      "namespace": "preprod",
      "server": "https://kubernetes.default.svc"
    },
    "project": "business-apps",
    "source": {
      "directory": {
        "recurse": false
      },
      "path": "apps/k8s-demo-app/environments/preprod/manifests",
      "repoURL": "https://github.com/KaloSora/tencentcloud-k8s-gitops.git",
      "targetRevision": "main"
    },
    "syncPolicy": {
      "automated": {
        "prune": false,
        "selfHeal": true
      }
    }
  }
}
